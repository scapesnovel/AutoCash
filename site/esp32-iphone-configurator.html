<html><body><h1>ESP32-iPhone Agent Connectivity Configurator</h1><p>Define your agent connection parameters and generate valid configuration schemas for the esp32-iphone-agent framework.</p><form><div><label>Device ID:</label><input type='text' id='deviceId'></div><div><label>Secret Token:</label><input type='password' id='token'></div><button type='button' onclick='generateConfig()'>Generate Config</button></form><pre id='output'></pre><script>function generateConfig(){const id=document.getElementById('deviceId').value;const token=document.getElementById('token').value;document.getElementById('output').innerText=JSON.stringify({deviceId:id,authToken:token,timestamp:new Date().toISOString()},null,2);}</script></body></html>
