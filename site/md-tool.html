<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Markdown Utilities</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; line-height: 1.5; }
    textarea { width: 100%; height: 150px; margin-bottom: 10px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Markdown Cleaner & Word Counter</h1>
  <textarea id="input" placeholder="Paste your Markdown here..."></textarea>
  <button onclick="process()">Analyze & Clean</button>
  <h3>Stats</h3>
  <p id="stats">Words: 0 | Chars: 0</p>
  <h3>Stripped Text</h3>
  <pre id="output"></pre>
  <script>
    function process() {
      const text = document.getElementById('input').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById('stats').innerText = `Words: ${words} | Chars: ${chars}`;
      // simple regex strip markdown tags
      const stripped = text.replace(/[#*`_~]/g, '');
      document.getElementById('output').innerText = stripped;
    }
  </script>
</body>
</html>
