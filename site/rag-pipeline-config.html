<!DOCTYPE html><html><head><title>AI System Design RAG Pipeline Configurator</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><link rel='stylesheet' href='style.css'><script>function generateConfig(){const doc=document.getElementById('config');const type=document.getElementById('type').value;const model=document.getElementById('model').value;doc.value=`RAG Pipeline Architecture:\nType: ${type}\nPrimary Model: ${model}\nPipeline Status: Ready for Deployment`;}</script></head><body><h1>RAG Pipeline Configurator</h1><select id='type'><option value='Basic RAG'>Basic RAG</option><option value='Agentic RAG'>Agentic RAG</option></select><select id='model'><option value='GPT-4o'>GPT-4o</option><option value='Claude 3.5 Sonnet'>Claude 3.5 Sonnet</option></select><button onclick='generateConfig()'>Generate Config</button><textarea id='config' readonly></textarea></body></html>
