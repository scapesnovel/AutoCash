<!DOCTYPE html><html><head><title>ZCode Harness Configurator</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{font-family:sans-serif;padding:20px;line-height:1.6;}textarea{width:100%;height:150px;}button{padding:10px 20px;background:#007bff;color:#fff;border:none;cursor:pointer;}</style></head><body><h1>ZCode Harness Configurator</h1><p>Configure your ZCode coding agent harness environment.</p><textarea id="config" placeholder="Enter agent settings..."></textarea><br><button onclick="generate()">Generate Config File</button><pre id="output"></pre><script>function generate(){const conf = document.getElementById('config').value; document.getElementById('output').innerText = 'zcode_harness_config: ' + btoa(conf);}</script></body></html>
