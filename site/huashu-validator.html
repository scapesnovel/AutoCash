<!DOCTYPE html><html><head><title>Huashu Skill Validator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;}textarea{width:100%;height:200px;font-family:monospace;}button{padding:10px 20px;cursor:pointer;background:#007bff;color:white;border:none;border-radius:4px;}</style></head><body><h1>Huashu Skill Validator</h1><p>Validate your <code>SKILL.md</code> for macOS agent automation.</p><textarea id='input' placeholder='Paste your SKILL.md content here...'></textarea><br><br><button onclick='validate()'>Validate Skill</button><pre id='result'></pre><script>function validate(){const val=document.getElementById('input').value;const res=document.getElementById('result');if(val.includes('name:') && val.includes('description:')){res.innerText='✅ Valid: Required metadata found.';}else{res.innerText='❌ Invalid: Missing required name or description fields.';}}</script></body></html>
