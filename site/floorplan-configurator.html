<!DOCTYPE html><html><head><title>3D Floorplan Scene Configurator</title><meta name='viewport' content='width=device-width, initial-scale=1'><link rel='stylesheet' href='style.css'></head><body><h1>3D Floorplan Scene Configurator</h1><p>Generate base scene configurations for floorplan-3d projects.</p><textarea id='config' rows='10' cols='50' placeholder='Enter scene parameters...'></textarea><br><button onclick='generate()'>Generate Configuration</button><pre id='output'></pre><script>function generate(){const input=document.getElementById('config').value;document.getElementById('output').innerText=JSON.stringify({scene:'floorplan',params:input,timestamp:new Date().toISOString()},null,2);}</script></body></html>
