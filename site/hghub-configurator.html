<!DOCTYPE html><html><head><title>HGhub Client Manifest & Preference Configurator</title><link rel='stylesheet' href='style.css'><meta http-equiv='Content-Security-Policy' content="default-src 'self'; style-src 'self' 'unsafe-inline';"><meta http-equiv='X-Content-Type-Options' content='nosniff'><meta http-equiv='X-Frame-Options' content='DENY'><meta name='referrer' content='no-referrer'></head><body><h1>HGhub Client Manifest & Preference Configurator</h1><p>Generate custom configuration manifests for the HGhub YellowFruit client.</p><textarea id='config' rows='10' cols='50' placeholder='Enter API override or preference settings'></textarea><button onclick='generate()'>Generate Manifest</button><script>function generate() { const val = document.getElementById('config').value; const config = { client: 'HGhub', version: '1.0', settings: val }; alert('Generated Manifest: ' + JSON.stringify(config)); }</script></body></html>
