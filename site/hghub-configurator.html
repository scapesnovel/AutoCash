<!DOCTYPE html><html><head><title>HGhub Media Player Configurator</title><meta charset='UTF-8'><meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"><meta http-equiv='X-Content-Type-Options' content='nosniff'><meta http-equiv='Referrer-Policy' content='no-referrer'><meta http-equiv='Content-Security-Policy' content="frame-ancestors 'none';"><style>body{font-family:sans-serif;margin:20px;line-height:1.6;}textarea{width:100%;height:150px;}</style></head><body><h1>HGhub Media Player Configurator</h1><p>Generate your custom HGhub plugin manifest and preference settings.</p><textarea id='input' placeholder='Enter media source URL or plugin ID...'></textarea><button onclick='generate()'>Generate Manifest</button><pre id='output'></pre><script>function generate(){const input=document.getElementById('input').value;const manifest={version:'1.0.0',source:input,plugins:['default-player','hls-support'],timestamp:new Date().toISOString()};document.getElementById('output').textContent=JSON.stringify(manifest,null,2);}</script></body></html>
