<!DOCTYPE html><html><head><title>HGhub Client Manifest & Preference Configurator</title></head><body><h1>HGhub Manifest Configurator</h1><p>Generate optimized manifest files and preference configurations for the HGhub movie-web-app.</p><form id='configForm'><label>API Gateway URL:</label><input type='text' id='api'><br><label>Streaming Quality:</label><select id='quality'><option>1080p</option><option>4K</option></select><br><button type='button' onclick='generate()'>Generate Manifest</button></form><pre id='output'></pre><script>function generate(){const api=document.getElementById('api').value;const q=document.getElementById('quality').value;document.getElementById('output').textContent=JSON.stringify({api,quality:q,features:['reels','drama']},null,2);}</script></body></html>
