<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PennyWise Financial Schema Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
  <h1 class="text-2xl font-bold mb-4">PennyWise Financial Schema Configurator</h1>
  <p class="mb-6 text-slate-400">Generate custom parsing rules for your transaction SMS and financial data exports.</p>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-slate-800 p-4 rounded">
      <label class="block mb-2">SMS Regex Pattern</label>
      <input type="text" id="regex" class="w-full p-2 bg-slate-900 rounded border border-slate-700" placeholder="^Spent (.*) at (.*) on (.*)$">
    </div>
    <div class="bg-slate-800 p-4 rounded">
      <label class="block mb-2">Export Format</label>
      <select id="format" class="w-full p-2 bg-slate-900 rounded border border-slate-700">
        <option>JSON</option>
        <option>CSV</option>
        <option>OFX</option>
      </select>
    </div>
  </div>
  <button onclick="alert('Schema generated!')" class="mt-6 bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded">Generate Config</button>
</body>
</html>
