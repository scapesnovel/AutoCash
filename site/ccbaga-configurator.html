<!DOCTYPE html>
<html>
<head>
  <title>CCBaga Environment & Identity Schema Configurator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    .controls { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>CCBaga Environment & Identity Schema Configurator</h1>
  <p>Configure your Claude identity archives and browser fingerprint seeds.</p>
  <label>Identity YAML:</label>
  <textarea id="yamlInput">identity_name: "default"
region: "US"
timezone: "America/New_York"
language: "en-US"
fingerprint_seed: "auto"</textarea>
  <div class="controls">
    <button onclick="copyToClipboard()">Copy Schema</button>
    <button onclick="validateYaml()">Validate Schema</button>
  </div>
  <p id="status"></p>
  <script>
    function copyToClipboard() {
      const text = document.getElementById('yamlInput').value;
      navigator.clipboard.writeText(text);
      document.getElementById('status').innerText = 'Copied to clipboard!';
    }
    function validateYaml() {
      const text = document.getElementById('yamlInput').value;
      document.getElementById('status').innerText = text.includes(':') ? 'Schema looks valid (basic check).' : 'Invalid format.';
    }
  </script>
</body>
</html>
