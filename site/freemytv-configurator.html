<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FreeMyTV Android Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
  <h1 class="text-2xl font-bold mb-4">FreeMyTV Android Configurator</h1>
  <p class="mb-4">Generate your custom ad-free home screen configuration for Google TV.</p>
  <div class="bg-slate-800 p-6 rounded-lg">
    <label class="block mb-2">App Package Name:</label>
    <input id="pkg" class="w-full p-2 mb-4 bg-slate-700 rounded" placeholder="com.example.app">
    <button onclick="generate()" class="bg-indigo-600 px-4 py-2 rounded">Generate Config</button>
    <pre id="out" class="mt-4 p-4 bg-black rounded overflow-x-auto"></pre>
  </div>
  <script>
    function generate() {
      const pkg = document.getElementById('pkg').value;
      document.getElementById('out').innerText = JSON.stringify({ homeScreenApp: pkg, adFree: true, undoButton: true }, null, 2);
    }
  </script>
</body>
</html>
