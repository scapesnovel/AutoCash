<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='referrer' content='no-referrer'>
    <meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Wireless Device Battery & Polling Schema Configurator</title>
</head>
<body>
    <h1>Wireless Device Battery & Polling Schema Configurator</h1>
    <p>Configure polling intervals and battery threshold alerts for your wireless device monitoring system.</p>
    <textarea id='output' rows='10' cols='50' readonly></textarea>
    <script>
        function generateSchema() {
            const schema = { "polling_interval_ms": 60000, "battery_threshold_low": 20, "alert_enabled": true };
            document.getElementById('output').value = JSON.stringify(schema, null, 2);
        }
        generateSchema();
    </script>
</body>
</html>
