<!DOCTYPE html><html><head><title>Mario Emulator State Mapper | Kairo Tools</title><link rel='stylesheet' href='style.css'></head><body><h1>Mario Emulator State Mapper</h1><p>Generate configuration files for mapping emulator memory addresses to structured agent inputs.</p><textarea id='input' placeholder='Paste emulator memory dump...'></textarea><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const input=document.getElementById('input').value;document.getElementById('output').innerText=JSON.stringify({mapping:input.split('\n'),version:'1.0'},null,2);}</script></body></html>
