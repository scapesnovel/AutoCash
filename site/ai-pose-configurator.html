<!DOCTYPE html><html><head><title>AI Pose & ControlNet Prompt Generator</title><meta http-equiv='Content-Security-Policy' content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"><meta http-equiv='Strict-Transport-Security' content='max-age=63072000; includeSubDomains; preload'><meta http-equiv='X-Content-Type-Options' content='nosniff'><meta http-equiv='X-Frame-Options' content='DENY'><meta name='referrer' content='no-referrer'><meta name='description' content='Schema builder for AI pose-to-prompt workflows (ControlNet/OpenPose).'><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;line-height:1.5;}textarea{width:100%;height:150px;}</style></head><body><h1>AI Pose & ControlNet Prompt Generator</h1><p>Generate standardized prompt schemas for ControlNet, OpenPose, and Flux workflows.</p><textarea id='schema' placeholder='Paste pose metadata or project context here...'></textarea><button onclick='generateSchema()'>Generate Schema</button><pre id='result'></pre><script>function generateSchema(){const input=document.getElementById('schema').value;const schema={type:'pose-control-config',version:'1.0',data:input,timestamp:new Date().toISOString()};document.getElementById('result').innerText=JSON.stringify(schema,null,2);}</script></body></html>
