<html><body><h1>Apple Silicon LLM Power-Efficiency Calculator</h1><p>Calculate your local LLM inference efficiency (tokens/watt/sec).</p><form id='calc'><input type='number' id='tokens' placeholder='Tokens per second' required><input type='number' id='watts' placeholder='Power draw (Watts)' required><button type='submit'>Calculate Efficiency</button></form><div id='result'></div><script>document.getElementById('calc').onsubmit = (e) => { e.preventDefault(); const t = document.getElementById('tokens').value; const w = document.getElementById('watts').value; document.getElementById('result').innerText = `Efficiency: ${(t/w).toFixed(2)} tokens/watt/sec`; };</script></body></html>
