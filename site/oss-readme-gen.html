<!DOCTYPE html><html><head><title>OSS README Generator</title></head><body><h1>OSS README Generator</h1><p>Generate a professional README for your OSS project to increase star rate.</p><textarea id='input' placeholder='Project name and description...'></textarea><button onclick='generate()'>Generate</button><pre id='output'></pre><script>function generate(){const name=document.getElementById('input').value;document.getElementById('output').innerText='# ' + name + '\n\n## Description\n\n## Installation\n\n## Usage';}</script></body></html>
