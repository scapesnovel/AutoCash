<!DOCTYPE html><html><head><title>PRAXIST Task Generator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;}textarea{width:100%;height:150px;margin:1em 0;}button{padding:0.5em 1em;background:#007bff;color:white;border:none;cursor:pointer;}pre{background:#f4f4f4;padding:1em;overflow-x:auto;}</style></head><body><h1>PRAXIST Task Generator</h1><p>Generate structured task definitions for your autonomous research.</p><input id="title" placeholder="Research Title"><textarea id="desc" placeholder="Research Description"></textarea><button onclick="generate()">Generate JSON</button><pre id="output"></pre><script>function generate(){const title=document.getElementById('title').value;const desc=document.getElementById('desc').value;const json={version:"1.0",task:{title:title,description:desc,status:"pending"}};document.getElementById('output').textContent=JSON.stringify(json,null,2);}</script></body></html>
