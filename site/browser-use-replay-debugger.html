<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Browser-Use Replay Debugger & Event Logger</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;}textarea{width:100%;height:200px;font-family:monospace;}button{padding:10px;margin-top:10px;cursor:pointer;}</style></head><body><h1>Browser-Use Replay Debugger & Event Logger</h1><p>Analyze and visualize event streams from your <code>jev-ultrafast</code> automation runs.</p><textarea id='jsonInput' placeholder='Paste your event log JSON here...'></textarea><button onclick='processLogs()'>Visualize/Debug</button><div id='output'></div><script>function processLogs(){const input = document.getElementById('jsonInput').value;try{const logs = JSON.parse(input);document.getElementById('output').innerHTML='<pre>'+JSON.stringify(logs,null,2)+'</pre>';}catch(e){alert('Invalid JSON log format.');}}</script></body></html>
