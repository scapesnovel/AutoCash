<!DOCTYPE html><html><head><title>DSH Plugin Dependency Visualizer</title><style>body{font-family:sans-serif;padding:20px;}textarea{width:100%;height:200px;}#output{margin-top:20px;padding:10px;background:#f4f4f4;}</style></head><body><h1>DSH Plugin Dependency Visualizer</h1><p>Paste your plugin.json config to visualize dependencies.</p><textarea id='input' placeholder='{"name": "my-plugin", "dependencies": [...]}'></textarea><button onclick='visualize()'>Visualize</button><div id='output'></div><script>function visualize(){const input = document.getElementById('input').value;try{const data = JSON.parse(input);document.getElementById('output').innerText = 'Dependencies for ' + data.name + ': ' + (data.dependencies ? data.dependencies.join(', ') : 'None');}catch(e){document.getElementById('output').innerText = 'Invalid JSON';}}</script></body></html>
