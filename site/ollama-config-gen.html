<!DOCTYPE html><html><head><title>Ollama Modelfile Generator</title><style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:auto;}textarea{width:100%;height:100px;margin-bottom:10px;}button{padding:10px;background:#007bff;color:white;border:none;cursor:pointer;}</style></head><body><h1>Ollama Modelfile Generator</h1><p>Define your model parameters and generate the Modelfile syntax.</p><label>System Prompt:</label><textarea id='sys'></textarea><label>Temperature (0.0-1.0):</label><input type='number' id='temp' value='0.7' step='0.1'><br><br><button onclick='gen()'>Generate Modelfile</button><pre id='out'></pre><script>function gen(){const s=document.getElementById('sys').value;const t=document.getElementById('temp').value;document.getElementById('out').textContent=`FROM llama3\nSYSTEM "${s}"\nPARAMETER temperature ${t}`;}</script></body></html>
