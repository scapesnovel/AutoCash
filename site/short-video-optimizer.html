<!DOCTYPE html><html><head><title>Short Video Prompt Optimizer</title><style>body { font-family: sans-serif; padding: 20px; } textarea { width: 100%; height: 100px; } button { margin-top: 10px; }</style></head><body><h1>Short Video Prompt Optimizer</h1><p>Optimize your prompts for the Short Video Generator AI.</p><textarea id='input' placeholder='Enter your video topic or raw prompt...'></textarea><button onclick='optimize()'>Optimize Prompt</button><div id='output'></div><script>function optimize() { const input = document.getElementById('input').value; document.getElementById('output').innerHTML = '<p><strong>Optimized Prompt:</strong></p><pre>Analyze video content for viral hook potential, optimize subtitle timing for retention, and select high-impact segments for: ' + input + '</pre>'; }</script></body></html>
