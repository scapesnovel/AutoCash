<!DOCTYPE html><html><head><title>M3E Canvas Prompt Debugger</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;}textarea{width:100%;height:150px;margin:1em 0;}button{padding:0.5em 1em;background:#007bff;color:white;border:none;cursor:pointer;}</style></head><body><h1>M3E Canvas Prompt Debugger</h1><p>Analyze and refine prompts generated from M3E Canvas exports.</p><textarea id='input' placeholder='Paste your M3E prompt here...'></textarea><button onclick='analyze()'>Analyze Prompt</button><div id='result'></div><script>function analyze(){const input=document.getElementById('input').value;const result=document.getElementById('result');if(input.length<10){result.innerHTML='<p style="color:red">Prompt too short to analyze.</p>';}else{result.innerHTML='<p>Prompt complexity: Medium. Suggested: Add more structural constraints to your M3E layout.</p>';}}</script></body></html>
