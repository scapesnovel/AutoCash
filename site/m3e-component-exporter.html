<!DOCTYPE html><html><head><title>M3E Component Style Exporter</title><style>body{font-family:sans-serif;padding:2rem;}textarea{width:100%;height:200px;}button{padding:1rem;margin-top:1rem;cursor:pointer;}</style></head><body><h1>M3E Component Style Exporter</h1><p>Convert M3E canvas JSON to React/Tailwind component structures.</p><textarea id='input' placeholder='Paste M3E canvas JSON here...'></textarea><button onclick='convert()'>Export Component</button><pre id='output'></pre><script>function convert(){const input=document.getElementById('input').value;try{const data=JSON.parse(input);const output=`// Generated React Component\nexport const M3EComponent = () => (\n  <div style={{color: '${data.primaryColor || '#000'}'}}>\n    {/* Component content based on M3E data */}\n  </div>\n);`;document.getElementById('output').innerText=output;}catch(e){alert('Invalid JSON');}}</script></body></html>
