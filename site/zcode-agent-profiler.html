<!DOCTYPE html><html><head><title>ZCode Agent Execution Profiler</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-gray-900 text-white p-8'><div class='max-w-2xl mx-auto'><h1>ZCode Agent Profiler</h1><textarea id='logs' class='w-full h-64 bg-gray-800 p-4' placeholder='Paste ZCode execution logs here...'></textarea><button onclick='profile()' class='bg-blue-600 p-2 mt-4'>Analyze Logs</button><div id='result' class='mt-4'></div></div><script>function profile() { const logs = document.getElementById('logs').value; const latency = (logs.match(/latency: (\d+)/g) || []).map(x => parseInt(x.split(' ')[1])); const avg = latency.length ? latency.reduce((a,b) => a+b, 0)/latency.length : 0; document.getElementById('result').innerText = 'Average Latency: ' + avg + 'ms'; }</script></body></html>
