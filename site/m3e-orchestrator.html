<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M3E Prompt Orchestrator - Generate Material 3 Expressive Prompts</title>
    <style>body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; } textarea { width: 100%; height: 150px; } button { padding: 0.5rem 1rem; background: #007bff; color: white; border: none; cursor: pointer; }</style>
</head>
<body>
    <h1>M3E Prompt Orchestrator</h1>
    <p>Structure your Material 3 Expressive designs into optimized vibe-coding prompts.</p>
    <textarea id="input" placeholder="Describe your design components..."></textarea>
    <button onclick="generate()">Generate Prompt</button>
    <pre id="output"></pre>
    <script>
        function generate() {
            const input = document.getElementById('input').value;
            document.getElementById('output').textContent = `M3E Design Prompt: ${input}\nFocus: Material 3 Expressive, Vibe-Coding, High-Fidelity UI.`;
        }
    </script>
</body>
</html>
