<!DOCTYPE html><html><head><title>Laya Decision Schema Validator</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{font-family:sans-serif;padding:20px;line-height:1.6;}textarea{width:100%;height:200px;font-family:monospace;}button{padding:10px 20px;cursor:pointer;}</style></head><body><h1>Laya Decision Schema Validator</h1><p>Validate your Laya decision logic schemas for structure and parameter correctness.</p><textarea id='schema' placeholder='Paste your Laya schema here...'></textarea><br><br><button onclick='validate()'>Validate Schema</button><pre id='result'></pre><script>function validate(){const schema=document.getElementById('schema').value;try{const parsed=JSON.parse(schema);document.getElementById('result').innerText='Valid JSON structure detected. Checking Laya specific parameters...';}catch(e){document.getElementById('result').innerText='Invalid JSON: '+e.message;}}</script></body></html>
