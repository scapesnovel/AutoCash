<!DOCTYPE html><html><head><title>Android TV Debloat Configurator</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-900 text-white p-8'><h1 class='text-2xl font-bold'>Android TV Debloat Configurator</h1><p>Select packages to remove and generate your custom ADB script.</p><textarea id='pkgs' class='w-full h-40 bg-slate-800 text-white p-2' placeholder='com.bloatware.example'></textarea><button onclick='gen()' class='bg-blue-600 p-2 mt-4'>Generate Script</button><pre id='out' class='mt-4 p-4 bg-black'></pre><script>function gen(){const lines=document.getElementById('pkgs').value.split('\n');let s='#!/bin/bash\n';lines.forEach(l=>{if(l.trim())s+='adb shell pm uninstall -k --user 0 '+l.trim()+'\n';});document.getElementById('out').innerText=s;}</script></body></html>
