<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAXIST Benchmark Suite Configurator | Free Online Tool</title>
    <meta name="description" content="Zero-dependency online configurator for PRAXIST research benchmark suites. Generate valid benchmark configuration JSON/YAML instantly.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        h1, h2, h3 { color: #38bdf8; }
        .container { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 8px 12px; margin-top: 4px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; margin-top: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        pre { background: #0f172a; padding: 16px; border-radius: 4px; overflow-x: auto; border: 1px solid #334155; border-left: 4px solid #38bdf8; }
        footer { margin-top: 40px; text-align: center; color: #64748b; font-size: 0.9em; }
        a { color: #38bdf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>PRAXIST Benchmark Suite Configurator</h1>
    <p>Construct validated configuration definitions for PRAXIST autonomous research benchmarks.</p>
    
    <div class="container">
        <form id="configForm">
            <label for="suiteName">Benchmark Suite Name</label>
            <input type="text" id="suiteName" value="llm-code-eval-v1" required>
            
            <label for="evalMetric">Primary Evaluation Metric</label>
            <select id="evalMetric">
                <option value="accuracy">Accuracy / Pass Rate</option>
                <option value="latency">Execution Latency (ms)</option>
                <option value="token_efficiency">Token Efficiency</option>
                <option value="reproducibility_score">Reproducibility Score</option>
            </select>
            
            <label for="maxIterations">Max Evaluation Runs</label>
            <input type="number" id="maxIterations" value="10" min="1" max="100">
            
            <label for="timeout">Timeout per Run (seconds)</label>
            <input type="number" id="timeout" value="300">
            
            <label for="targetAgents">Target Agent Specs (comma-separated)</label>
            <input type="text" id="targetAgents" value="praxist-core, claude-code, custom-agent">
            
            <button type="button" onclick="generateConfig()">Generate Config JSON</button>
        </form>
    </div>

    <div class="container">
        <h2>Generated Benchmark Config</h2>
        <pre id="output">Click 'Generate Config JSON' to build file...</pre>
        <button onclick="copyOutput()">Copy to Clipboard</button>
    </div>

    <footer>
        <p>Part of the <a href="/index.html">L32 Micro-Tool Suite</a> | Built for <a href="https://github.com/sapientinc/PRAXIST" target="_blank">PRAXIST Ecosystem</a></p>
    </footer>

    <script>
        function generateConfig() {
            const name = document.getElementById('suiteName').value.trim();
            const metric = document.getElementById('evalMetric').value;
            const maxRuns = parseInt(document.getElementById('maxIterations').value, 10);
            const timeout = parseInt(document.getElementById('timeout').value, 10);
            const agents = document.getElementById('targetAgents').value.split(',').map(s => s.trim()).filter(Boolean);
            
            const config = {
                praxist_version: "1.0",
                suite: {
                    name: name,
                    metric: metric,
                    execution: {
                        max_runs: maxRuns,
                        timeout_seconds: timeout,
                        parallel: false
                    },
                    targets: agents,
                    validation_rules: {
                        require_executable_output: true,
                        strict_reproducibility: true
                    }
                }
            };
            
            document.getElementById('output').textContent = JSON.stringify(config, null, 2);
        }

        function copyOutput() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => alert('Config copied to clipboard!'));
        }
        
        // Auto-generate on load
        generateConfig();
    </script>
</body>
</html>
