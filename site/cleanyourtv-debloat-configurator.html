<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanYourTV Android Debloat Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">CleanYourTV Configurator</h1>
    <p class="mb-6">Generate custom ADB commands to debloat your Android TV device.</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium">Device Model</label>
        <input id="model" type="text" class="w-full bg-slate-800 p-2 rounded" placeholder="e.g. Shield TV, Chromecast 4K">
      </div>
      <button onclick="generate()" class="bg-indigo-600 px-4 py-2 rounded">Generate Script</button>
      <pre id="output" class="bg-black p-4 rounded text-xs overflow-x-auto font-mono text-green-400"></pre>
    </div>
  </div>
  <script>
    function generate() {
      const model = document.getElementById('model').value;
      const script = `# CleanYourTV ADB Debloat Script for ${model}\n# Generated by Kairo Factory\nadb shell pm uninstall -k --user 0 com.google.android.videos\nadb shell pm uninstall -k --user 0 com.google.android.music\nadb shell pm uninstall -k --user 0 com.android.providers.partnerbookmarks`;
      document.getElementById('output').textContent = script;
    }
  </script>
</body>
</html>
