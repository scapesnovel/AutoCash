<!DOCTYPE html><html><head><title>Laya Decision Logic Configurator</title><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{font-family:sans-serif;padding:20px;} textarea{width:100%;height:100px;} button{padding:10px;margin-top:10px;}</style></head><body><h1>Laya Decision Logic Configurator</h1><p>Define your choices and scoring parameters for Laya non-autoregressive decision models.</p><textarea id='input' placeholder='Enter choices (e.g., Yes, No, Maybe)'></textarea><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const input=document.getElementById('input').value;document.getElementById('output').innerText=JSON.stringify({choices:input.split(','),mode:'non-autoregressive',version:'1.0'},null,2);}</script></body></html>
