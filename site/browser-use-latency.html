<html><head><title>Browser-Use Latency Benchmarker</title></head><body><h1>Browser-Use Latency Benchmarker</h1><p>Measure automation performance in milliseconds.</p><button onclick='runBenchmark()'>Run Test</button><div id='result'></div><script>async function runBenchmark() { const start = performance.now(); await new Promise(r => setTimeout(r, 100)); const end = performance.now(); document.getElementById('result').innerText = 'Latency: ' + (end - start).toFixed(2) + 'ms'; }</script></body></html>
