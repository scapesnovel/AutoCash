<!DOCTYPE html><html><head><title>JARVIS Screen-Reading Trigger Configurator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;}textarea{width:100%;height:150px;}</style></head><body><h1>JARVIS Trigger Configurator</h1><p>Define your screen-reading trigger rules for JARVIS.</p><textarea id='rules' placeholder='Enter trigger logic (e.g., IF element.text CONTAINS "Urgent" THEN trigger.response = "Prioritize")'></textarea><br><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const rules=document.getElementById('rules').value;document.getElementById('output').innerText=JSON.stringify({version:'1.0',triggers:rules.split('\n')},null,2);}</script></body></html>
