<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>JARVIS Screen-Reading Trigger Configurator</title><link rel='stylesheet' href='style.css'></head><body><h1>JARVIS Trigger Rule Configurator</h1><p>Define your screen-reading triggers and response rules for JARVIS.</p><textarea id='rules' rows='10' cols='50' placeholder='Define your trigger rules here...'></textarea><br><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const rules=document.getElementById('rules').value;document.getElementById('output').innerText=JSON.stringify({triggers: rules.split('\n')}, null, 2);}</script></body></html>
