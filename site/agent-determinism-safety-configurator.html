<!DOCTYPE html><html><head><title>Agentic Determinism & Safety Configurator | L32 Factory</title><style>body{font-family:sans-serif;line-height:1.6;max-width:800px;margin:20px auto;padding:0 20px;background:#f4f4f9}textarea{width:100%;height:150px;margin-bottom:10px}button{padding:10px 20px;background:#007bff;color:white;border:none;cursor:pointer}#output{background:#fff;padding:15px;margin-top:20px;border:1px solid #ddd;white-space:pre-wrap}</style></head><body><h1>Agentic Determinism & Safety Configurator</h1><p>Configure deterministic edit protocols and safety guardrails for your LLM agents.</p><textarea id='config' placeholder='Define safety guardrails (e.g., block unauthorized file system access, limit token depth)...'></textarea><button onclick='generate()'>Generate Config Schema</button><div id='output'></div><script>function generate(){const cfg=document.getElementById('config').value;document.getElementById('output').innerText='// Deterministic Protocol Schema:\n{\n "guardrails": "'+cfg.replace(/\n/g, ' ') + '",\n "deterministic_mode": true,\n "safety_level": "high"\n}';}</script></body></html>
