<!DOCTYPE html><html><head><title>MCP Server Config Generator</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;}input,button{display:block;margin:10px 0;padding:8px;width:100%;max-width:300px;}</style></head><body><h1>MCP Server Config Generator</h1><p>Generate JSON configuration for your MCP servers.</p><input type='text' id='name' placeholder='Server Name'><input type='text' id='cmd' placeholder='Command'><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const name=document.getElementById('name').value;const cmd=document.getElementById('cmd').value;const config={mcpServers:{[name]:{command:cmd,args:[]}}};document.getElementById('output').textContent=JSON.stringify(config,null,2);}</script></body></html>
