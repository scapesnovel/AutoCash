<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCP Server Config Generator</title>
    <style>body { font-family: sans-serif; padding: 20px; line-height: 1.5; } textarea { width: 100%; height: 100px; } button { margin-top: 10px; padding: 10px; }</style>
</head>
<body>
    <h1>MCP Server Config Generator</h1>
    <p>Generate JSON configuration for your MCP server.</p>
    <label>Server Name:</label><input type="text" id="name" placeholder="x64dbg-mcp">
    <label>Command:</label><input type="text" id="cmd" placeholder="x64dbg-mcp-server">
    <button onclick="generate()">Generate Config</button>
    <textarea id="output"></textarea>
    <script>
        function generate() {
            const config = { mcpServers: { [document.getElementById('name').value]: { command: document.getElementById('cmd').value } } };
            document.getElementById('output').value = JSON.stringify(config, null, 2);
        }
    </script>
</body>
</html>
