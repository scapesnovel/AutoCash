<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Agent Autoloop Configurator</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; background: #2c2c2c; border: 1px solid #444; color: white; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class='container'>
        <h1>Agent Autoloop Configurator</h1>
        <p>Configure your <code>agent-autoloop</code> task manifest.</p>
        <label>Task Interval (sec):</label><input type='number' id='interval' value='60'>
        <label>Max Iterations:</label><input type='number' id='max_iter' value='5'>
        <label>Approval Required:</label><select id='approval'><option value='true'>True</option><option value='false'>False</option></select>
        <button onclick='generate()'>Generate Config</button>
        <pre id='output'></pre>
    </div>
    <script>
        function generate() {
            const config = { interval: document.getElementById('interval').value, max_iter: document.getElementById('max_iter').value, approval: document.getElementById('approval').value };
            document.getElementById('output').textContent = JSON.stringify(config, null, 2);
        }
    </script>
</body>
</html>
