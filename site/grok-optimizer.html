<!DOCTYPE html>
<html>
<head>
<title>Grok Bot Config Optimizer</title>
<style>body{font-family:sans-serif;padding:20px;line-height:1.6;} .container{max-width:600px;margin:auto;} textarea{width:100%;height:150px;}</style>
</head>
<body>
<div class="container">
<h1>Grok Bot Config Optimizer</h1>
<p>Paste your grok-bot config JSON below to optimize parameters.</p>
<textarea id="input" placeholder='{"mode": "auto", "latency": 500}'></textarea>
<button onclick="optimize()">Optimize Config</button>
<pre id="output"></pre>
</div>
<script>
function optimize() {
  const input = document.getElementById('input').value;
  try {
    const config = JSON.parse(input);
    config.optimized = true;
    config.timestamp = new Date().toISOString();
    document.getElementById('output').innerText = JSON.stringify(config, null, 2);
  } catch(e) { alert('Invalid JSON'); }
}
</script>
</body>
</html>
