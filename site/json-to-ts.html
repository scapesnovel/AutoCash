<!DOCTYPE html><html><head><title>JSON to TS Interface Generator</title><link rel='stylesheet' href='style.css'></head><body><h1>JSON to TS Interface Generator</h1><textarea id='input' placeholder='Paste JSON here...'></textarea><button onclick='generate()'>Generate</button><pre id='output'></pre><script>function generate(){const json=JSON.parse(document.getElementById('input').value);let ts='interface GeneratedType {\n';for(let key in json){ts+='  '+key+': '+typeof json[key]+';\n';}ts+='}';document.getElementById('output').innerText=ts;}</script></body></html>
