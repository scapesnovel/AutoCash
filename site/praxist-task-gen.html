<!DOCTYPE html><html><head><title>PRAXIST Research Task Generator</title><link rel='stylesheet' href='style.css'></head><body><h1>PRAXIST Research Task Generator</h1><p>Generate structured JSON definitions for your PRAXIST autonomous research tasks.</p><textarea id='input' placeholder='Describe your research goal...'></textarea><button onclick='generate()'>Generate JSON</button><pre id='output'></pre><script>function generate() { const goal = document.getElementById('input').value; const json = { version: '1.0', task: goal, parameters: { autonomous: true, depth: 'high' } }; document.getElementById('output').textContent = JSON.stringify(json, null, 2); }</script></body></html>
