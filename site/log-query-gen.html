<!DOCTYPE html>
<html lang='en'>
<head><meta charset='UTF-8'><title>Log Query Generator</title><style>body{font-family:sans-serif;padding:2rem;line-height:1.5;max-width:800px;margin:auto;}</style></head>
<body>
<h1>Log Query Generator</h1>
<p>Convert natural language to filter strings for Winston/Pino.</p>
<textarea id='input' placeholder='e.g., show me errors from today' style='width:100%;height:100px;'></textarea>
<button onclick='generate()'>Generate Query</button>
<pre id='output'></pre>
<script>
function generate() {
  const input = document.getElementById('input').value;
  const output = document.getElementById('output');
  if (input.includes('error')) {
    output.innerText = 'level:error | filter:timestamp>today';
  } else {
    output.innerText = 'level:info | filter:all';
  }
}
</script>
</body>
</html>
