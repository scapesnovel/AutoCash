<!DOCTYPE html><html><head><title>ZCode Harness Converter</title></head><body><h1>ZCode Harness Converter</h1><p>Convert your prompts into ZCode harness configurations.</p><textarea id='input' placeholder='Paste your prompt here...'></textarea><button onclick='convert()'>Convert</button><pre id='output'></pre><script>function convert() { const input = document.getElementById('input').value; document.getElementById('output').innerText = JSON.stringify({ harness: 'zcode-v1', prompt: input, strategy: 'default' }, null, 2); }</script></body></html>
