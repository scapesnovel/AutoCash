<!DOCTYPE html><html><head><title>ZCode Harness Converter</title></head><body><h1>ZCode Harness Converter</h1><p>Convert legacy agent configs to current ZCode harness schemas.</p><textarea id='input' placeholder='Paste old config here'></textarea><button onclick='convert()'>Convert</button><pre id='output'></pre><script>function convert(){const input=document.getElementById('input').value;document.getElementById('output').innerText=JSON.stringify({harness_version:'2.0',config:input},null,2);}</script></body></html>
