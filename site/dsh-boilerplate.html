<!DOCTYPE html><html><head><title>DSH Plugin Boilerplate Generator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:1em;line-height:1.6;} input,select{width:100%;padding:0.5em;margin:1em 0;} button{background:#006cbf;color:white;padding:0.7em;border:none;cursor:pointer;} #output{background:#f4f4f4;padding:1em;white-space:pre-wrap;}</style></head><body><h1>DSH Plugin Boilerplate Generator</h1><p>Quickly generate configuration for your DeepSeek Harness plugin.</p><input id="name" placeholder="Plugin Name"><select id="type"><option value="agent">Agent Plugin</option><option value="tool">Tool Plugin</option></select><button onclick="generate()">Generate Config</button><div id="output"></div><script>function generate(){const name=document.getElementById('name').value||'my-plugin';const type=document.getElementById('type').value;const config={name,type,version:'1.0.0',dependencies:{'dsh-core':'^1.0.0'}};document.getElementById('output').innerText=JSON.stringify(config,null,2);}</script><footer><p>Part of the <a href="https://autocash.scapesnovel.workers.dev">AutoCash</a> ecosystem.</p></footer></body></html>
