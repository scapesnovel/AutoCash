<!DOCTYPE html><html><head><title>Machine Anatomy SVG Configurator</title><meta charset='UTF-8'><style>body{font-family:sans-serif;padding:20px;} .config-box{border:1px solid #ccc;padding:15px;margin-top:10px;}</style></head><body><h1>Machine Anatomy SVG Configurator</h1><div class='config-box'><label>SVG Component ID:</label><input type='text' id='comp-id' placeholder='e.g., gear-01'><br><br><label>Path Complexity:</label><input type='range' id='complexity' min='1' max='10'><br><br><button onclick='generate()'>Export Config Schema</button></div><pre id='output'></pre><script>function generate(){const id=document.getElementById('comp-id').value;const c=document.getElementById('complexity').value;document.getElementById('output').textContent=JSON.stringify({component:id,complexity:c,timestamp:new Date().toISOString()},null,2);}</script></body></html>
