<!DOCTYPE html>
<html lang="en">
<head><title>PRAXIST Task Validator</title></head>
<body>
<h1>PRAXIST Task Validator</h1>
<textarea id="jsonInput" placeholder="Paste your pipeline JSON here..."></textarea>
<button onclick="validate()">Validate</button>
<div id="result"></div>
<script>
function validate() {
    try {
        const data = JSON.parse(document.getElementById('jsonInput').value);
        document.getElementById('result').innerText = 'Valid PRAXIST Configuration';
    } catch(e) { document.getElementById('result').innerText = 'Invalid JSON: ' + e.message; }
}
</script>
</body>
</html>
