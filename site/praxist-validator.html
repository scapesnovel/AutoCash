<!DOCTYPE html><html><head><title>PRAXIST Research Task Validator</title><link rel="stylesheet" href="style.css"></head><body><h1>PRAXIST Research Task Validator</h1><textarea id="jsonInput" placeholder="Paste your task JSON here..."></textarea><button onclick="validate()">Validate Task</button><div id="result"></div><script>function validate(){const input=document.getElementById('jsonInput').value;try{const data=JSON.parse(input);if(data.goal && data.constraints){document.getElementById('result').innerText='Valid PRAXIST Task Structure detected.';}else{document.getElementById('result').innerText='Error: Missing required fields (goal, constraints).';}}catch(e){document.getElementById('result').innerText='Invalid JSON format.';}}</script></body></html>
