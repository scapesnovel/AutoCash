<!DOCTYPE html><html><head><title>OpenBot Agent-Schema Validator</title><meta charset='utf-8'><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;line-height:1.5;}textarea{width:100%;height:200px;}button{padding:0.5em 1em;background:#007bff;color:white;border:none;cursor:pointer;}#result{margin-top:1em;padding:1em;border-radius:4px;}</style></head><body><h1>OpenBot Agent-Schema Validator</h1><p>Validate your AI agent schema JSON for the OpenBot protocol.</p><textarea id='schema' placeholder='Paste JSON schema here...'></textarea><br><br><button onclick='validate()'>Validate Schema</button><div id='result'></div><script>function validate(){const schema=document.getElementById('schema').value;const result=document.getElementById('result');try{const parsed=JSON.parse(schema);if(parsed.agentName && parsed.capabilities){result.innerHTML='<b style="color:green">Valid Schema!</b>';}else{result.innerHTML='<b style="color:red">Invalid: Missing agentName or capabilities.</b>';}}catch(e){result.innerHTML='<b style="color:red">Invalid JSON: '+e.message+'</b>';}}</script></body></html>
