<!DOCTYPE html><html><head><title>ThreeUI Component Catalog Generator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:1em;line-height:1.6;} input{width:100%;padding:0.5em;margin:1em 0;} button{background:#222;color:white;padding:0.7em;border:none;cursor:pointer;} #output{background:#f9f9f9;padding:1em;white-space:pre-wrap;border-left:4px solid #333;}</style></head><body><h1>ThreeUI Component Catalog Generator</h1><p>Scaffold your interactive UI component structure.</p><input id="compName" placeholder="Component Name (e.g., HeroSection)"><button onclick="generate()">Generate Structure</button><div id="output"></div><script>function generate(){const name=document.getElementById('compName').value||'MyComponent';const structure={name,type:'ThreeUI.Component',version:'1.0.0',files:[{name:`${name}.tsx`,content:'import React from \'react\'; export const ${name} = () => <div>${name}</div>;'}]};document.getElementById('output').innerText=JSON.stringify(structure,null,2);}</script></body></html>
