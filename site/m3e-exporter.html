<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M3E Design-to-Code Exporter</title>
    <meta name="description" content="Convert your M3E canvas designs into production-ready React components.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">M3E Design-to-Code Exporter</h1>
        <textarea id="input" class="w-full h-40 bg-gray-800 p-4 rounded mb-4" placeholder="Paste your M3E canvas JSON output here..."></textarea>
        <button onclick="convert()" class="bg-blue-600 px-6 py-2 rounded">Convert to React Component</button>
        <pre id="output" class="mt-4 p-4 bg-black rounded overflow-x-auto text-sm"></pre>
    </div>
    <script>
        function convert() {
            const input = document.getElementById('input').value;
            try {
                const json = JSON.parse(input);
                const code = `import React from 'react';\n\nexport const M3EComponent = () => (\n  <div className="p-4">\n    {/* Generated from M3E Canvas: ${json.id || 'unknown'} */}\n  </div>\n);`;
                document.getElementById('output').textContent = code;
            } catch(e) {
                document.getElementById('output').textContent = 'Invalid JSON input.';
            }
        }
    </script>
</body>
</html>
