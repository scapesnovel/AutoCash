<!DOCTYPE html><html><head><title>JARVIS Chat Copilot Persona & Rules Generator</title><link rel='stylesheet' href='style.css'></head><body><h1>JARVIS Chat Copilot Persona & Rules Generator</h1><p>Define custom personas and interaction rules for your JARVIS-based chat agents.</p><textarea id='input' placeholder='Enter persona traits or interaction rules...'></textarea><button onclick='generate()'>Generate Configuration</button><div id='output'></div><script>function generate(){const input = document.getElementById('input').value; document.getElementById('output').innerText = 'JARVIS Persona Config: ' + JSON.stringify({persona: input || 'Default Assistant', rules: ['context-aware', 'low-latency', 'safety-first'], version: '1.0'}, null, 2);}</script></body></html>
