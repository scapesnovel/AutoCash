<!DOCTYPE html><html><head><title>PRAXIST Environment Validator</title></head><body><h1>PRAXIST Environment Validator</h1><p>Check your research environment configuration for compatibility with PRAXIST pipelines.</p><textarea id='config' placeholder='Paste your config.json here...' style='width:100%;height:200px;'></textarea><button onclick='validate()'>Validate</button><pre id='result'></pre><script>function validate(){const c=document.getElementById('config').value;try{const j=JSON.parse(c);if(j.research_target && j.execution_mode)document.getElementById('result').innerText='Valid environment configuration!';else document.getElementById('result').innerText='Missing required fields: research_target, execution_mode';}catch(e){document.getElementById('result').innerText='Invalid JSON format';}}</script></body></html>
