<!DOCTYPE html><html><head><title>M3E Design Token Exporter</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;}textarea{width:100%;height:200px;margin:10px 0;}button{padding:10px;background:#007bff;color:white;border:none;cursor:pointer;}</style></head><body><h1>M3E Design Token Exporter</h1><p>Paste your M3E canvas JSON to export design tokens.</p><textarea id='input' placeholder='Paste JSON here...'></textarea><button onclick='exportTokens()'>Export Tokens</button><pre id='output'></pre><script>function exportTokens(){const input = document.getElementById('input').value;try{const data = JSON.parse(input);const tokens = {colors: data.colors || {}, spacing: data.spacing || {}};document.getElementById('output').textContent = JSON.stringify(tokens, null, 2);}catch(e){alert('Invalid JSON');}}</script></body></html>
