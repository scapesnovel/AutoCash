<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M3E Design Token Exporter</title>
    <style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:auto;} textarea{width:100%;height:200px;} button{margin-top:10px;padding:10px;}</style>
</head>
<body>
    <h1>M3E Design Token Exporter</h1>
    <p>Paste your M3E canvas JSON to export production-ready CSS variables.</p>
    <textarea id="input" placeholder="Paste M3E JSON here..."></textarea>
    <button onclick="exportTokens()">Export CSS Variables</button>
    <pre id="output"></pre>
    <script>
        function exportTokens() {
            const input = document.getElementById('input').value;
            try {
                const data = JSON.parse(input);
                let css = ':root {\n';
                for (const [key, value] of Object.entries(data.tokens || {})) {
                    css += `  --m3e-${key}: ${value};\n`;
                }
                css += '}';
                document.getElementById('output').textContent = css;
            } catch (e) { alert('Invalid JSON'); }
        }
    </script>
</body>
</html>
