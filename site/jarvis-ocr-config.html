<!DOCTYPE html><html><head><title>JARVIS OCR & Screen Reading Rule Configurator</title><meta name='viewport' content='width=device-width, initial-scale=1'><link rel='stylesheet' href='style.css'></head><body><h1>JARVIS OCR & Screen Reading Rule Configurator</h1><p>Configure screen extraction zones and reply trigger rules for your JARVIS AI copilot.</p><textarea id='config' rows='10' placeholder='Define your extraction zones (JSON format)...'></textarea><button onclick='generate()'>Generate Config</button><pre id='output'></pre><script>function generate(){const conf = document.getElementById('config').value; document.getElementById('output').textContent = JSON.stringify({ocr_zones: conf, timestamp: new Date().toISOString()}, null, 2);}</script></body></html>
