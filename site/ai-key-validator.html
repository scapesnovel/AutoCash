<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Local AI API Key Validator</title><style>body{font-family:sans-serif;max-width:600px;margin:2em auto;padding:1em;}textarea{width:100%;height:100px;margin-bottom:1em;}button{padding:0.5em 1em;cursor:pointer;}</style></head><body><h1>AI Key Validator</h1><p>Validate your API key format (e.g., OpenAI, Anthropic, Groq).</p><textarea id="config" placeholder="Paste your API key here..."></textarea><button onclick="validate()">Validate Key</button><div id="result" style="margin-top:1em;font-weight:bold;"></div><script>function validate() { const val = document.getElementById('config').value.trim(); const patterns = [/^(sk-|gsk-)/, /^anthropic-/, /^[A-Za-z0-9]{32,}$/]; const isValid = patterns.some(p => p.test(val)); document.getElementById('result').innerText = isValid ? '✅ Likely a valid key format.' : '❌ Invalid or unrecognized key format.'; }</script></body></html>
