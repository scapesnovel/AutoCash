<!DOCTYPE html><html><head><title>Muse-Gadget MTU Provisioning Validator</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;padding:0 1em;line-height:1.5;}textarea{width:100%;height:150px;}</style></head><body><h1>Muse-Gadget MTU Provisioning Validator</h1><p>Generate compliant GATT write chunks for Android 15+ compatibility (capped at 512 bytes).</p><textarea id='input' placeholder='Paste your full payload here...'></textarea><button onclick='process()'>Generate Valid Chunks</button><pre id='output'></pre><script>function process(){const input = document.getElementById('input').value;const chunks = [];for(let i=0; i<input.length; i+=512){chunks.push(input.substring(i, i+512));}document.getElementById('output').textContent = JSON.stringify(chunks, null, 2);}</script></body></html>
